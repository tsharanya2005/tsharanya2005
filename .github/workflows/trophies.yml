name: Generate GitHub Profile Trophies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: write

jobs:
  trophy:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Trophy SVG
        uses: ryo-ma/github-profile-trophy@v1
        with:
          github_user_name: tsharanya2005
          output_path: ./trophy.svg

      - name: Commit Trophy SVG
        uses: EndBug/add-and-commit@v9
        with:
          message: "Update GitHub trophies"
          add: "trophy.svg"
